; nb_web local dev defaults
display_errors = On
error_reporting = E_ALL
date.timezone = Asia/Bangkok
; PHP 8.5: โค้ด legacy + mpdf/tcpdf เก่าจะปล่อย E_DEPRECATED เยอะ
; log ไว้ที่ docker logs เพื่อค่อย ๆ แก้ทีละจุด
log_errors = On
error_log = /proc/self/fd/2


max_execution_time = 5000
max_input_time = 5000
memory_limit = 1000M
post_max_size = 750M
upload_max_filesize = 750M
