; nb_web local dev defaults
display_errors = On
error_reporting = E_ALL
date.timezone = Asia/Bangkok
; PHP 8.5 — deprecation/warning จะขึ้นหน้าจอเพราะ display_errors=On
; ถ้าต้องการซ่อน deprecation ระหว่างข้าม PHP 8 ให้ใช้ E_ALL & ~E_DEPRECATED
log_errors = On
error_log = /proc/self/fd/2


max_execution_time = 5000
max_input_time = 5000
memory_limit = 1000M
post_max_size = 750M
upload_max_filesize = 750M
