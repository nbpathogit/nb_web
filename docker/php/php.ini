; nb_web local dev defaults
display_errors = On
error_reporting = E_ALL
date.timezone = Asia/Bangkok
; โค้ด legacy หลายหน้าส่ง output ก่อน session_start()/header()
; (เช่น patient_pdf.php เริ่มด้วย HTML ก่อน <?php) — บน shared hosting/XAMPP
; มี output_buffering=4096 พรางไว้ให้ ถ้าไม่เปิดจะเจอ "headers already sent"
; และ PDF เสีย (ob_clean() ก่อน $mpdf->Output() ต้องมี buffer ถึงจะทำงาน)
output_buffering = 4096
; PHP 8.5: โค้ด legacy + mpdf/tcpdf เก่าจะปล่อย E_DEPRECATED เยอะ
; log ไว้ที่ docker logs เพื่อค่อย ๆ แก้ทีละจุด
log_errors = On
error_log = /proc/self/fd/2


max_execution_time = 5000
max_input_time = 5000
memory_limit = 1000M
post_max_size = 750M
upload_max_filesize = 750M
