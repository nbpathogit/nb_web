; nb_web local dev defaults
display_errors = On
error_reporting = E_ALL
memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300
date.timezone = Asia/Bangkok
; PHP 7.4 compat for old code (avoid fatal on curly-brace / each() etc. -> still log them)
; log deprecated so you can fix legacy code gradually
log_errors = On
error_log = /proc/self/fd/2
