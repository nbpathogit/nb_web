services:
  app:
    build:
      context: ./docker/php
    image: nb_web-app:8.5-apache
    container_name: nb_web-app
    # Database.php hardcode db_host = "localhost" แก้ใน compose อย่างเดียวได้ด้วยวิธีนี้:
    # ใช้ network namespace เดียวกับ db -> "localhost" ใน app = MySQL ใน db
    network_mode: service:db
    depends_on:
      - db
    volumes:
      - ./:/var/www/html
    restart: unless-stopped

  db:
    image: mysql:5.7
    container_name: nb_web-db
    ports:
      # ต้องเปิดเว็บผ่าน http://localhost (port 80, ไม่มีเลข port ต่อท้าย)
      # เพราะ Database.php เช็ค $_SERVER['HTTP_HOST'] == "localhost" แบบตรงตัว
      # ถ้าเข้าผ่าน :8080 ค่า HTTP_HOST จะเป็น "localhost:8080" แล้วจะไม่เข้าเงื่อนไข
      - "80:80"
      - "3306:3306"
    environment:
      # ตรงกับเงื่อนไข localhost ใน classes/Database.php:25-37
      # (subfolder = "" -> db nbpa_data)
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nbpa_data
      MYSQL_USER: nbpa_nbpatho
      MYSQL_PASSWORD: '@6i3#xdyJusmDfBJ'
    volumes:
      - db_data:/var/lib/mysql
    command: --character-set-server=utf8 --collation-server=utf8_general_ci --sql-mode=""
    restart: unless-stopped

  phpmyadmin:
    # phpMyAdmin 6 ยังไม่มีบน Docker Hub (เช็ค 2026-10-25: ไม่มี tag 6.x เลย ล่าสุดคือสาย 5.2.x)
    # 5.2-apache = alias ล่าสุดของสาย 5.2 (ตอนนี้ชี้ที่ 5.2.3) พอมี 6 จริง ค่อยเปลี่ยน
    image: phpmyadmin:5.2-apache
    container_name: nb_web-pma
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 256M
    volumes:
      - ./docker/phpmyadmin/config.user.inc.php:/etc/phpmyadmin/config.user.inc.php:ro
    depends_on:
      - db
    restart: unless-stopped

  ftp:
    image: stilliard/pure-ftpd:latest
    container_name: nb_web-ftp
    ports:
      - "21:21"
      - "30000-30009:30000-30009"
    environment:
      PUBLICHOST: localhost
      FTP_USER_NAME: nbftp
      FTP_USER_PASS: "ChangeMe_1234"
      FTP_USER_HOME: /home/nbftp
    volumes:
      - ./:/home/nbftp
    restart: unless-stopped

  # FTP เฉพาะลูกค้า pathokph — chroot อยู่ที่ customerfileb/pathokph เท่านั้น
  # (login แล้วเห็นรายงานตัวเอง ไม่เห็น source code / ลูกค้ารายอื่นเหมือน user nbftp หลัก)
  # เชื่อมต่อ: ftp://localhost:2121 user pathokph
  # FTP_USER_UID=33 = www-data ของ container app เพื่อให้ไฟล์ที่ FTP upload มา
  # เจ้าของตรงกับไฟล์ที่ PHP เขียน (เปลี่ยนถ้าจะให้ download อย่างเดียวก็ตั้งได้)
  ftp_pathokph:
    image: stilliard/pure-ftpd:latest
    container_name: nb_web-ftp-pathokph
    ports:
      # port 21 หลักถูก container ftp ของ nbftp ใช้อยู่ -> ใช้ 2121 แทน
      - "2121:21"
      # passive range ต้องไม่ชนกับ 30000-30009 ของ container ftp หลัก
      - "30010-30019:30000-30009"
    environment:
      PUBLICHOST: localhost
      FTP_USER_NAME: pathokph
      FTP_USER_PASS: "ChangeMe_pathokph"
      FTP_USER_HOME: /home/pathokph
      FTP_USER_UID: 33
    volumes:
      - ./customerfileb/pathokph:/home/pathokph
    restart: unless-stopped

  # Beszel — monitoring dashboard (hub + agent)
  # เข้า dashboard: http://localhost:8090 (ครั้งแรกให้สร้าง admin account ในหน้าเว็บ)
  beszel:
    image: henrygd/beszel:latest
    container_name: nb_web-beszel
    ports:
      - "8090:8090"
    environment:
      APP_URL: http://localhost:8090
    volumes:
      - beszel_data:/beszel_data
      - beszel_socket:/beszel_socket
    restart: unless-stopped

  # Agent เก็บ metrics (CPU/RAM/Docker containers) ส่งเข้า hub ด้านบน
  # hub คุยกับ agent ผ่าน unix socket ใน volume beszel_socket
  # (ใช้ named volume เพราะ bind mount บน Windows/NTFS ใช้ unix socket ไม่ได้)
  #
  # ใช้ network ปกติ ไม่ใช่ network_mode: host ตาม doc ของ beszel
  # เพราะ Docker Desktop บน Windows ต้องเปิด host networking เอง
  # ผลข้างเคียง: ไม่มีสถิติ network interface ของ host
  #
  # ** ต้องใส่ KEY กับ TOKEN ก่อน ไม่งั้น agent จะ restart วนไปเรื่อยๆ **
  # 1) เปิด http://localhost:8090 -> สร้าง admin -> Add System แล้วจะเห็น KEY
  # 2) TOKEN สร้างได้ที่ http://localhost:8090/settings/tokens
  # 3) เอาค่าทั้งสองมาใส่ด้านล่าง แล้วรัน docker compose up -d ใหม่
  # 4) ตอน Add System ใน hub ให้ใส่ Host/IP = /beszel_socket/beszel.sock
  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: nb_web-beszel-agent
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: http://beszel:8090
      TOKEN: ""
      KEY: ""
    volumes:
      - beszel_agent_data:/var/lib/beszel-agent
      - beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - beszel
    restart: unless-stopped

volumes:
  db_data:
  beszel_data:
  beszel_socket:
  beszel_agent_data:
